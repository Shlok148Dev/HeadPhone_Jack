[project]
name = "jingle-common"
version = "0.1.0"
description = "Shared Pydantic models, event schemas, crypto and logging for Jingle Python services"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "cryptography>=43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jingle_common"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
target-version = "py312"
