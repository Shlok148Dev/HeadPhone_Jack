[project]
name = "core-api"
version = "0.1.0"
description = "Jingle core API (Django + DRF)"
requires-python = ">=3.12"
dependencies = [
  "jingle-common",
  "django>=5.1,<5.3",
  "djangorestframework>=3.15",
  "drf-spectacular>=0.27",
  "djangorestframework-simplejwt>=5.3",
  "django-cors-headers>=4.4",
  "django-environ>=0.11",
  "django-filter>=24.3",
  "psycopg[binary]>=3.2",
  "argon2-cffi>=23.1",
  "redis>=5.0",
  "pymongo>=4.8",
  "celery[redis]>=5.4",
  "django-celery-beat>=2.7",
  "gunicorn>=23",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "google-auth>=2.34",
  "requests>=2.32",
  "better-profanity>=0.7",
  "qrcode>=7.4",
  "pywebpush>=2.0",
]

[project.optional-dependencies]
ml = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "python-igraph>=0.11",
  "leidenalg>=0.10",
  "qdrant-client>=1.11",
  "networkx>=3.3",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-django>=4.9",
  "pytest-bdd>=7.3",
  "pytest-cov>=5",
  "factory-boy>=3.3",
  "time-machine>=2.15",
  "fakeredis>=2.24",
  "mongomock>=4.2",
  "ruff>=0.6",
  "mypy>=1.11",
  "django-stubs>=5.0",
]

[tool.uv.sources]
jingle-common = { path = "../../packages/py-common", editable = true }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core_api.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ"]
ignore = ["S101", "S105", "S106"]

[tool.coverage.run]
source = ["core_api", "accounts", "social", "circles", "recs", "rituals", "moderation", "feed", "sources", "jingle_ml"]
omit = ["*/migrations/*", "*/tests/*"]
