openapi: 3.1.0
info:
  title: Jingle API
  version: 1.0.0
paths:
  /api/v1/admin/allowlist:
    get:
      operationId: admin_allowlist_retrieve
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allowlist'
          description: ''
    post:
      operationId: admin_allowlist_add
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllowlistAddRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AllowlistAddRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AllowlistAddRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ALLOWLIST_FULL
    delete:
      operationId: admin_allowlist_remove
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/budgets:
    get:
      operationId: admin_budgets_retrieve
      description: 'JNG-12-04: per-source budgets and live usage, read from ingest-ml.'
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budgets'
          description: ''
  /api/v1/admin/flags:
    get:
      operationId: admin_flags_retrieve
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFlags'
          description: ''
    put:
      operationId: admin_flags_set
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetFlagRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetFlagRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetFlagRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND
  /api/v1/artwork:
    get:
      operationId: artwork_retrieve
      parameters:
      - in: query
        name: artist
        schema:
          type: string
        required: true
      - in: query
        name: title
        schema:
          type: string
      tags:
      - artwork
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtworkResult'
          description: ''
  /api/v1/artwork/wall:
    get:
      operationId: artwork_wall_retrieve
      description: Real covers for the logged-out homepage (public; covers only, no
        people).
      tags:
      - artwork
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtworkWall'
          description: ''
  /api/v1/auth/google:
    post:
      operationId: auth_google_create
      description: |-
        JNG-01-01: Google sign-in. First sign-in creates an account that still needs onboarding
        (editable auto-derived username; birth year required before feed access).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthResponse'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: GOOGLE_TOKEN_INVALID
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ACCOUNT_EXISTS
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: GOOGLE_SIGNIN_DISABLED
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: 'JNG-01-01: email + password sign-in.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: INVALID_CREDENTIALS
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: RATE_LIMITED
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: Blacklist the refresh token and clear the cookie. Always 204.
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: Signed out
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: 'ADR-0011: rotate the refresh cookie; the presented token is blacklisted.'
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: REFRESH_INVALID
  /api/v1/auth/register:
    post:
      operationId: auth_register_create
      description: 'JNG-01-01: sign up with email. Rejects under-18 birth years (NFR-PRIV-02).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: VALIDATION_ERROR
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AGE_RESTRICTED
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: RATE_LIMITED
  /api/v1/battles/{battle_id}/votes:
    post:
      operationId: battles_votes_create
      parameters:
      - in: path
        name: battle_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - rituals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BattleVoteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BattleVoteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BattleVoteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Battle'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: OWN_NOMINATION
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: VOTING_CLOSED
  /api/v1/battles/{battle_id}/votes/{nomination_id}:
    delete:
      operationId: battles_unvote
      parameters:
      - in: path
        name: battle_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: nomination_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - rituals
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Battle'
          description: ''
  /api/v1/blends:
    get:
      operationId: blends_list
      tags:
      - blends
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Blend'
          description: ''
    post:
      operationId: blends_create
      tags:
      - blends
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBlendRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateBlendRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateBlendRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blend'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: VALIDATION_ERROR
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND
  /api/v1/blends/{blend_id}:
    get:
      operationId: blends_retrieve
      parameters:
      - in: path
        name: blend_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - blends
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blend'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND
    delete:
      operationId: blends_destroy
      parameters:
      - in: path
        name: blend_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - blends
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND
  /api/v1/blends/{blend_id}/regenerate:
    post:
      operationId: blends_regenerate_create
      parameters:
      - in: path
        name: blend_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - blends
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blend'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND
  /api/v1/blends/{blend_id}/tracks/{track_id}/pin:
    post:
      operationId: blends_pin
      parameters:
      - in: path
        name: blend_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: track_id
        schema:
          type: integer
        required: true
      tags:
      - blends
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlendTrack'
          description: ''
    delete:
      operationId: blends_unpin
      parameters:
      - in: path
        name: blend_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: track_id
        schema:
          type: integer
        required: true
      tags:
      - blends
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlendTrack'
          description: ''
  /api/v1/blocks:
    get:
      operationId: blocks_list
      tags:
      - social
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Person'
          description: ''
    post:
      operationId: blocks_create
      tags:
      - social
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BlockUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BlockUserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND
  /api/v1/blocks/{user_id}:
    delete:
      operationId: blocks_destroy
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - social
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/circles:
    get:
      operationId: circles_list
      tags:
      - circles
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Circle'
          description: ''
    post:
      operationId: circles_create
      tags:
      - circles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCircleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateCircleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateCircleRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Circle'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: VALIDATION_ERROR
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: CIRCLE_LIMIT
  /api/v1/circles/{circle_id}:
    get:
      operationId: circles_retrieve
      parameters:
      - in: path
        name: circle_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - circles
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Circle'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND
    patch:
      operationId: circles_partial_update
      description: 'JNG-04-07: admins set the name, visibility, who can invite and
        the battle schedule.'
      parameters:
      - in: path
        name: circle_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - circles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCircleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCircleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCircleRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Circle'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: FORBIDDEN
    delete:
      operationId: circles_destroy
      description: Leave (owners of a one-person circle close it; otherwise they transfer
        first).
      parameters:
      - in: path
        name: circle_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - circles
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/circles/{circle_id}/battle:
