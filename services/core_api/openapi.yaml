          - $ref: '#/components/schemas/CardRecording'
          - type: 'null'
        observed_at:
          type: string
          format: date-time
          description: Omitted when the owner hides precise time, and for TOP/HIDDEN.
        freshness_label:
          type: string
        degraded:
          type: boolean
        attribution:
          oneOf:
          - $ref: '#/components/schemas/AttributionEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - attribution
      - degraded
      - freshness_label
      - friend
      - platform
      - recording
      - state
    FeedCardPlatformEnum:
      enum:
      - SPOTIFY
      - APPLE_MUSIC
      - AMAZON_MUSIC
      - YOUTUBE_MUSIC
      - UNKNOWN
      type: string
      description: |-
        * `SPOTIFY` - SPOTIFY
        * `APPLE_MUSIC` - APPLE_MUSIC
        * `AMAZON_MUSIC` - AMAZON_MUSIC
        * `YOUTUBE_MUSIC` - YOUTUBE_MUSIC
        * `UNKNOWN` - UNKNOWN
