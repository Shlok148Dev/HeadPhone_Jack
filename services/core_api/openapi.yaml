          allOf:
          - $ref: '#/components/schemas/ActivityVisibilityEnum'
          readOnly: true
        show_last_active:
          type: boolean
          readOnly: true
        concerts_visible:
          type: boolean
          readOnly: true
        private_mode:
          allOf:
          - $ref: '#/components/schemas/PrivateModeState'
          readOnly: true
      required:
      - activity_visibility
      - concerts_visible
      - private_mode
      - show_last_active
    PrivateModeEnum:
      enum:
      - 1h
      - 8h
      - until_off
      - 'off'
      type: string
      description: |-
        * `1h` - 1 hour
        * `8h` - 8 hours
        * `until_off` - Until I turn it off
        * `off` - Off
    PrivateModeState:
      type: object
      properties:
        active:
          type: boolean
        until:
