      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Battle'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND
  /api/v1/circles/{circle_id}/battle/nominate:
    post:
      operationId: circles_battle_nominate_create
      parameters:
      - in: path
        name: circle_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - rituals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NominateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NominateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NominateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Battle'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOMINATIONS_CLOSED
  /api/v1/circles/{circle_id}/battle/skip:
    post:
      operationId: circles_battle_skip_create
      parameters:
      - in: path
        name: circle_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - rituals
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
