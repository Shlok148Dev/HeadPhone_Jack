  /api/v1/circles/{circle_id}/feed:
    get:
      operationId: circles_feed_list
      description: 'JNG-04-04: members'' cards, each under that member''s own privacy
        rules.'
      parameters:
      - in: path
        name: circle_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - circles
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedCard'
          description: ''
  /api/v1/circles/{circle_id}/invites:
    post:
      operationId: circles_invite_friends
      description: Invite friends (direct) — they must accept (BR-08).
      parameters:
      - in: path
        name: circle_id
        schema:
          type: string
          format: uuid
        required: true
