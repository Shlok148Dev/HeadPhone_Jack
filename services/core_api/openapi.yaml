openapi: 3.1.0
info:
  title: Jingle API
  version: 1.0.0
paths:
  /api/v1/auth/google:
    post:
      operationId: auth_google_create
      description: |-
        JNG-01-01: Google sign-in. First sign-in creates an account that still needs onboarding
        (editable auto-derived username; birth year required before feed access).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthResponse'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: GOOGLE_TOKEN_INVALID
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ACCOUNT_EXISTS
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: GOOGLE_SIGNIN_DISABLED
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: 'JNG-01-01: email + password sign-in.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: INVALID_CREDENTIALS
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: RATE_LIMITED
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: Blacklist the refresh token and clear the cookie. Always 204.
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: Signed out
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: 'ADR-0011: rotate the refresh cookie; the presented token is blacklisted.'
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: REFRESH_INVALID
  /api/v1/auth/register:
    post:
      operationId: auth_register_create
      description: 'JNG-01-01: sign up with email. Rejects under-18 birth years (NFR-PRIV-02).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: VALIDATION_ERROR
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AGE_RESTRICTED
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: RATE_LIMITED
  /api/v1/blocks:
    get:
      operationId: blocks_list
      tags:
      - social
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Person'
          description: ''
    post:
      operationId: blocks_create
      tags:
      - social
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BlockUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BlockUserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND
  /api/v1/blocks/{user_id}:
    delete:
      operationId: blocks_destroy
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - social
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/connections:
    get:
      operationId: connections_list
      description: 'BR-13/BR-15: one row per platform with honest capabilities. No
        route words (BR-14).'
      tags:
      - sources
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'
          description: ''
  /api/v1/connections/{platform}:
    delete:
      operationId: connections_destroy
      description: 'JNG-01-09: disconnect one music app without affecting the others.'
      parameters:
      - in: path
        name: platform
        schema:
          type: string
        required: true
      tags:
      - sources
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND
  /api/v1/flags:
    get:
      operationId: flags_list
      description: 'Public feature flags for the web app (BR-11: hidden integrations
        stay hidden).'
      tags:
      - flags
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicFlags'
          description: ''
  /api/v1/friends:
    get:
      operationId: friends_list
      description: 'JNG-02-02: my accepted friends.'
      tags:
      - social
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Person'
          description: ''
  /api/v1/friends/{user_id}:
    delete:
      operationId: friends_destroy
      description: 'JNG-02-03: remove a friend.'
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - social
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND
  /api/v1/friends/requests:
    get:
      operationId: friends_requests_list
      tags:
      - social
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Request'
          description: ''
    post:
      operationId: friends_requests_create
      tags:
      - social
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendFriendRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendFriendRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendFriendRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: RATE_LIMITED
  /api/v1/friends/requests/{request_id}:
    delete:
      operationId: friends_requests_destroy
      description: Cancel my own pending request.
      parameters:
      - in: path
        name: request_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - social
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND
  /api/v1/friends/requests/{request_id}/{action}:
    post:
      operationId: friends_requests_respond
      parameters:
      - in: path
        name: action
        schema:
          type: string
        required: true
      - in: path
        name: request_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - social
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND
  /api/v1/imports/{job_id}:
    get:
      operationId: imports_retrieve
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
        required: true
      tags:
      - sources
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportStatus'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND
  /api/v1/imports/youtube:
    post:
      operationId: imports_youtube_create
      description: 'JNG-01-06: upload a Google Takeout watch history (≤ 50 MB) → 202
        + job id.'
      tags:
      - sources
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TakeoutUploadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: VALIDATION_ERROR
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: CONSENT_REQUIRED
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: FILE_TOO_LARGE
  /api/v1/invites/{code}:
    get:
      operationId: invites_retrieve
      description: Public preview (first name only) and accept, which sends a request
        to the owner.
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - social
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreview'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND
    post:
      operationId: invites_create
      description: Public preview (first name only) and accept, which sends a request
        to the owner.
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - social
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND
  /api/v1/me:
    get:
      operationId: me_retrieve
      description: JNG-01-01 profile, JNG-01-12 onboarding fields, JNG-01-10 account
        deletion.
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: UNAUTHENTICATED
    patch:
      operationId: me_partial_update
      description: JNG-01-01 profile, JNG-01-12 onboarding fields, JNG-01-10 account
        deletion.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: VALIDATION_ERROR | BIRTH_YEAR_LOCKED
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: AGE_RESTRICTED (account is removed)
    delete:
      operationId: me_destroy
      description: 'JNG-01-10: delete my account. Hidden and anonymised now; purged
        within 30 days.'
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '202':
          description: Account scheduled for deletion
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: CONFIRMATION_REQUIRED
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: CONFIRMATION_FAILED
  /api/v1/me/card:
    get:
      operationId: me_card_retrieve
      description: 'JNG-05-01: my own card (Live / Recent / Top) with platform and
        freshness.'
      tags:
      - feed
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedCard'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: UNAUTHENTICATED
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ONBOARDING_REQUIRED
  /api/v1/me/consents:
    get:
      operationId: me_consents_list
      description: 'NFR-PRIV-01: itemised consents with plain-language descriptions.'
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentItem'
          description: ''
  /api/v1/me/consents/{purpose}:
    post:
      operationId: me_consents_create
      description: 'NFR-PRIV-01: give or withdraw one purpose, as easily as it was
        given.'
      parameters:
      - in: path
        name: purpose
        schema:
          type: string
          enum:
          - activity_sharing
          - contact_matching
          - core_service
          - email_digest
          - lastfm_link
          - push_notifications
          - suggestions_discoverability
        required: true
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConsentUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConsentUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentItem'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: UNKNOWN_PURPOSE
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: CONSENT_REQUIRED
  /api/v1/me/export:
    get:
      operationId: me_export_retrieve
      description: 'JNG-13-04 / NFR-PRIV-06: download my data as JSON.'
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: RATE_LIMITED
  /api/v1/me/invite:
    get:
      operationId: me_invite_retrieve
      description: 'JNG-02-07: my invite link and QR code.'
      tags:
      - social
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
          description: ''
    post:
      operationId: me_invite_create
      description: 'JNG-02-07: my invite link and QR code.'
      tags:
      - social
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
          description: ''
  /api/v1/me/privacy:
    get:
      operationId: me_privacy_retrieve
      description: JNG-02-05 hide precise last-active time; JNG-02-06 Private mode
        (1 h, 8 h, until off).
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Privacy'
          description: ''
    patch:
      operationId: me_privacy_partial_update
      description: JNG-02-05 hide precise last-active time; JNG-02-06 Private mode
        (1 h, 8 h, until off).
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPrivacyUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPrivacyUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPrivacyUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Privacy'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: VALIDATION_ERROR
  /api/v1/reports:
    post:
      operationId: reports_create
      description: 'JNG-12-01: report a user (circles, notes and comments join as
        they ship).'
      tags:
      - social
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: VALIDATION_ERROR
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: RATE_LIMITED
  /api/v1/sources/{platform}/connect:
    post:
      operationId: sources_connect_create
      description: 'JNG-01-14: one button per platform; the orchestrator picks the
        route (BR-13).'
      parameters:
      - in: path
        name: platform
        schema:
          type: string
        required: true
      tags:
      - sources
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectPlan'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: NOT_FOUND
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: CONSENT_REQUIRED
  /api/v1/sources/companion/token:
    post:
      operationId: sources_companion_token_create
      description: 'JNG-01-13: issue a Jingle Companion push token. Shown once; only
        its hash is stored.'
      tags:
      - sources
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanionToken'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: CONSENT_REQUIRED
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: RATE_LIMITED
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: UPSTREAM_UNAVAILABLE
  /api/v1/sources/lastfm/callback:
    get:
      operationId: sources_lastfm_callback_retrieve
      description: Last.fm's web-auth callback (``?state=…&token=…``).
      parameters:
      - in: query
        name: state
        schema:
          type: string
      - in: query
        name: token
        schema:
          type: string
      tags:
      - sources
      security:
      - {}
      responses:
        '302':
          description: No response body
  /api/v1/sources/lastfm/username:
    post:
      operationId: sources_lastfm_username_create
      description: Connect a public Last.fm profile by username (needs the ``lastfm_link``
        consent).
      tags:
      - sources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkLastfmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LinkLastfmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LinkLastfmRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: LASTFM_FAILED
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: CONSENT_REQUIRED
  /api/v1/sources/listenbrainz:
    post:
      operationId: sources_listenbrainz_create
      description: 'JNG-01-02 "Other ways to connect": paste a ListenBrainz user token.'
      tags:
      - sources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkListenBrainzRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LinkListenBrainzRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LinkListenBrainzRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: TOKEN_INVALID
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: CONSENT_REQUIRED
  /api/v1/sources/spotify/callback:
    get:
      operationId: sources_spotify_callback_retrieve
      description: Spotify's redirect target. State-bound (no cookies needed; ADR-0016).
      parameters:
      - in: query
        name: code
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
      tags:
      - sources
      security:
      - {}
      responses:
        '302':
          description: No response body
  /api/v1/users/search:
    get:
      operationId: users_search_list
      description: 'JNG-02-01: by username (anyone) or display name (discoverable
        people only). Blocks hide both ways.'
      parameters:
      - in: query
        name: q
        schema:
          type: string
      tags:
      - social
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Person'
          description: ''
components:
  schemas:
    ActionEnum:
      enum:
      - redirect
      - lastfm_then_spotify
      - browser
      type: string
      description: |-
        * `redirect` - redirect
        * `lastfm_then_spotify` - lastfm_then_spotify
        * `browser` - browser
    ActivityVisibilityEnum:
      enum:
      - friends
      - circles
      - nobody
      type: string
      description: |-
        * `friends` - Friends
        * `circles` - Circles
        * `nobody` - Nobody
    AttributionEnum:
      enum:
      - SPOTIFY
      type: string
      description: '* `SPOTIFY` - SPOTIFY'
    AuthResponse:
      type: object
      properties:
        access:
          type: string
        user:
          $ref: '#/components/schemas/Me'
      required:
      - access
      - user
    BlockUserRequest:
      type: object
