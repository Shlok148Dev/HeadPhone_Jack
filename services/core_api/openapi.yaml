      description: |-
        * `SPOTIFY` - SPOTIFY
        * `APPLE_MUSIC` - APPLE_MUSIC
        * `YOUTUBE_MUSIC` - YOUTUBE_MUSIC
        * `AMAZON_MUSIC` - AMAZON_MUSIC
