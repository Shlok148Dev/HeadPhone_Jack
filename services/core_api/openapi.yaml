            Turn Private mode on for a duration, or off.

            * `1h` - 1 hour
            * `8h` - 8 hours
            * `until_off` - Until I turn it off
            * `off` - Off
    Person:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        avatar_url:
          type:
          - string
          - 'null'
        relationship:
          $ref: '#/components/schemas/RelationshipEnum'
      required:
      - avatar_url
      - display_name
      - id
      - relationship
      - username
    Privacy:
      type: object
