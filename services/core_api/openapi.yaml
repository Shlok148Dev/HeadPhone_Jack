        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invited'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: CIRCLE_FULL
  /api/v1/circles/{circle_id}/links:
    post:
      operationId: circles_links_create
      parameters:
      - in: path
        name: circle_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - circles
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CircleLink'
          description: ''
  /api/v1/circles/{circle_id}/members/{user_id}:
    patch:
      operationId: circles_members_partial_update
      parameters:
      - in: path
        name: circle_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - circles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSetRoleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSetRoleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSetRoleRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: FORBIDDEN
    delete:
      operationId: circles_members_destroy
      parameters:
      - in: path
        name: circle_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - circles
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: FORBIDDEN
  /api/v1/circles/{circle_id}/season:
    get:
      operationId: circles_season_retrieve
      parameters:
      - in: path
        name: circle_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - rituals
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'
          description: ''
  /api/v1/circles/{circle_id}/transfer:
    post:
      operationId: circles_transfer_create
      parameters:
      - in: path
        name: circle_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - circles
      requestBody:
