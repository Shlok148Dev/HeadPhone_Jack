          - string
          - 'null'
          format: uuid
        title:
          type: string
        artist:
          type: string
        album:
          type:
          - string
          - 'null'
        artwork_url:
          type:
          - string
          - 'null'
          format: uri
        links:
          $ref: '#/components/schemas/Links'
      required:
      - album
      - artist
      - artwork_url
      - id
      - links
      - title
    CompanionToken:
      type: object
      properties:
        token:
          type: string
      required:
      - token
    ConnectPlan:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/ActionEnum'
        url:
          type:
          - string
          - 'null'
          format: uri
        live_on_phone:
          type: boolean
      required:
      - action
      - live_on_phone
      - url
    Connection:
      type: object
      properties:
        platform:
          type: string
        status:
          type: string
        first_play_at:
          type:
          - string
          - 'null'
          format: date-time
        last_signal_at:
          type:
          - string
          - 'null'
          format: date-time
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        note:
          type: string
      required:
      - capabilities
      - first_play_at
      - last_signal_at
      - note
      - platform
      - status
    ConsentItem:
      type: object
      properties:
        purpose:
          $ref: '#/components/schemas/PurposeEnum'
        description:
          type: string
        required:
          type: boolean
        given:
          type: boolean
        version:
          type:
          - string
          - 'null'
        given_at:
          type:
          - string
          - 'null'
          format: date-time
        withdrawn_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - description
      - given
      - given_at
      - purpose
      - required
      - version
      - withdrawn_at
    ConsentUpdateRequest:
      type: object
      properties:
        given:
          type: boolean
      required:
      - given
    CreateReportRequest:
      type: object
      properties:
        target_type:
          $ref: '#/components/schemas/TargetTypeEnum'
        target_id:
          type: string
          format: uuid
        reason:
          $ref: '#/components/schemas/ReasonEnum'
        details:
          type: string
          maxLength: 1000
      required:
      - reason
      - target_id
      - target_type
    DirectionEnum:
      enum:
      - incoming
      - outgoing
      type: string
      description: |-
        * `incoming` - incoming
        * `outgoing` - outgoing
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
        request_id:
          type:
          - string
          - 'null'
      required:
      - code
      - details
      - message
      - request_id
    ErrorEnvelope:
      type: object
      description: CONTRACTS.md §8 error envelope.
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
    FeedCard:
      type: object
      description: CONTRACTS.md §7. Never carries the ingestion route (BR-14).
      properties:
        friend:
          $ref: '#/components/schemas/FriendRef'
        state:
          $ref: '#/components/schemas/StateEnum'
        platform:
          description: |-
            Null when HIDDEN.

            * `SPOTIFY` - SPOTIFY
            * `APPLE_MUSIC` - APPLE_MUSIC
            * `AMAZON_MUSIC` - AMAZON_MUSIC
            * `YOUTUBE_MUSIC` - YOUTUBE_MUSIC
            * `UNKNOWN` - UNKNOWN
