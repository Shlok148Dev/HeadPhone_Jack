        display_name:
          type: string
          minLength: 1
          maxLength: 60
        username:
          type: string
          minLength: 3
          maxLength: 20
        college:
          type: string
          maxLength: 120
        city:
          type: string
          maxLength: 80
        birth_year:
          type: integer
          maximum: 2100
          minimum: 1900
