[project]
name = "ingest-ml"
version = "0.1.0"
description = "Jingle ingestion and inference service (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "jingle-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "tenacity>=9.0",
  "motor>=3.5",
  "redis>=5.0",
  "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary]>=3.2",
  "rapidfuzz>=3.9",
  "ijson>=3.3",
  "pyjwt[crypto]>=2.9",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "respx>=0.21",
  "fakeredis[lua]>=2.24",
  "mongomock-motor>=0.0.34",
  "time-machine>=2.15",
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest-bdd>=8.1.0",
  "aiosqlite>=0.22.1",
]

[tool.uv.sources]
jingle-common = { path = "../../packages/py-common", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
markers = ["JNG-01-13: push endpoint acceptance (SRS JNG-01-13)"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ijson", "ijson.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
# FastAPI dependency injection uses call defaults by design.
"ingest_ml/api/*.py" = ["B008"]
