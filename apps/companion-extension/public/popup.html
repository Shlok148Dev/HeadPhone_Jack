<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Jingle Companion</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="brand">
        <img src="icons/icon-32.png" width="24" height="24" alt="" />
        <h1>Jingle Companion</h1>
      </header>

      <section aria-labelledby="status-h">
        <h2 id="status-h" class="sr-only">Status</h2>
        <p id="status" role="status" aria-live="polite">Loading…</p>
        <p id="now" class="muted" hidden></p>
        <p id="error" class="error" role="alert" hidden></p>
      </section>

      <section id="signed-out" hidden>
        <button id="sign-in" class="primary" type="button">Sign in to Jingle</button>
        <details>
          <summary>Paste a token instead</summary>
          <form id="token-form">
            <label for="token">Scrobble token from Jingle settings</label>
            <input id="token" type="password" autocomplete="off" spellcheck="false" required minlength="8" />
            <button type="submit">Connect</button>
          </form>
        </details>
      </section>

      <section id="signed-in" hidden>
        <label class="switch-row">
          <span>Pause sharing</span>
          <input id="paused" type="checkbox" role="switch" />
        </label>
        <fieldset>
          <legend>Share from</legend>
          <div id="platforms"></div>
        </fieldset>
        <button id="sign-out" type="button" class="link">Sign out</button>
      </section>

      <details>
        <summary>Jingle server</summary>
        <form id="origin-form">
          <label for="origin">Jingle address</label>
          <input id="origin" type="url" required placeholder="http://127.0.0.1:8080" />
          <button type="submit">Save</button>
          <p class="muted small">Plays are sent only to this address.</p>
        </form>
      </details>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
