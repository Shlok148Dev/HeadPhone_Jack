name: Bug report
description: Something in Jingle isn't working as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problem? Don't file it here — see SECURITY.md. Never paste tokens, passwords or other people's personal data."
  - type: textarea
    id: what
    attributes: { label: What happened, description: And what you expected instead. }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Web (desktop), Web (phone), Android app, Chrome extension, API / backend]
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Browser / OS / app version }
