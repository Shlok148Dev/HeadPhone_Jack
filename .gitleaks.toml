# Secret scanning (CI: .github/workflows/security.yml and ci.yml). Default rules stay on; this only
# exempts values that are known, documented and non-secret. Keep the list short and specific.
[extend]
useDefault = true

[allowlist]
description = "Test fixtures and the documented dev-only key"
# Throwaway passwords for test users created inside the test database.
paths = [
  '''^services/(core_api|ingest_ml)/tests/''',
  '''^packages/py-common/tests/''',
]
# base64("dev-only-32-byte-key-for-local!!"): the local stand-in KEK in .env.example and CI.
# Production generates its own (infra/deploy/bootstrap.sh); this value is refused when JINGLE_ENV=production.
regexes = [
  '''ZGV2LW9ubHktMzItYnl0ZS1rZXktZm9yLWxvY2FsISE=''',
]
